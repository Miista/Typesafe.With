name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Typesafe.With.sln

      - name: Build
        run: dotnet build src/Typesafe.With.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Typesafe.With.sln --configuration Release --no-build --verbosity normal
