name: Release

# Push a tag like v1.3.0 to build, test, pack, publish to nuget.org via Trusted
# Publishing (no stored API key) and create a GitHub release with the packages.
#
# Requires:
# - nuget.org Trusted Publishing policy: owner Miista, repo Typesafe.With,
#   workflow release.yml, environment nuget
# - GitHub environment "nuget" (add required reviewers to approve each release)
# - Repository variable NUGET_USER: the nuget.org account name (profile name, not email)

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # request the OIDC token for nuget.org Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches nuspec version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          nuspec_version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' nuget/Typesafe.With.nuspec | head -1)"
          echo "Tag: $tag_version, nuspec: $nuspec_version"
          if [ "$tag_version" != "$nuspec_version" ]; then
            echo "::error::Tag v$tag_version does not match nuspec version $nuspec_version"
            exit 1
          fi

      - name: Test
        run: dotnet test src/Typesafe.With.sln --configuration Release

      - name: Pack
        run: >
          dotnet pack src/Typesafe.With/Typesafe.With.csproj
          --configuration Release --no-build
          --include-source --include-symbols
          -p:NuspecFile=../../nuget/Typesafe.With.nuspec
          -p:NuspecBasePath=bin/Release
          --output artifacts

      - name: Verify package contents
        run: |
          pkg="artifacts/Typesafe.With.${GITHUB_REF_NAME#v}.nupkg"
          contents="$(unzip -l "$pkg")"
          echo "$contents"
          for expected in lib/netstandard2.0/Typesafe.With.dll lib/netstandard2.0/Typesafe.With.xml docs/README.md; do
            grep -q "$expected" <<< "$contents" || { echo "::error::$expected missing from $pkg"; exit 1; }
          done

      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        run: >
          dotnet nuget push "artifacts/Typesafe.With.${GITHUB_REF_NAME#v}.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes
